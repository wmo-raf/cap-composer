project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_TOKEN

"base_path": "."
"base_url": "https://api.crowdin.com"

"preserve_hierarchy": true

files:
  # Base & config
  - source: /capcomposer/src/capcomposer/cap/locale/en/LC_MESSAGES/django.po
    translation: /capcomposer/src/capcomposer/cap/locale/%two_letters_code%/LC_MESSAGES/%original_file_name%
    skip_untranslated_strings: true
    export_translated_only: true

  - source: /capcomposer/src/capcomposer/capeditor/locale/en/LC_MESSAGES/django.po
    translation: /capcomposer/src/capcomposer/cap/locale/%two_letters_code%/LC_MESSAGES/%original_file_name%
    skip_untranslated_strings: true
    export_translated_only: true
